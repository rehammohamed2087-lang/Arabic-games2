2410c;margin:2px 0}\n.cert .nm{font-size:2.3rem;font-weight:800;color:#7c4dff;border-bottom:3px dotted #d99a00;display:inline-block;max-width:92%;padding:0 12px;margin:6px 0;word-break:break-word}\n.cert p{margin:6px 0;font-size:1.1rem;font-weight:500;color:#3b2a00}\n.cert .dec{font-size:1.5rem;letter-spacing:4px}\n@media (prefers-reduced-motion:reduce){.mascot,.pop,.bad,.hint{animation:none}}\n<\/style>\n<\/head>\n<body>\n<div id=\"app\"><\/div>\n<script>\nvar SC='#ff914d',QC='#2d9cff';\nvar T2=[['ذَهَبَ','n'],['سَالِمٌ','n'],['إِلَى','n'],['الْحَدِيقَةِ،','q'],['ثُمَّ','n'],['لَعِبَ','n'],['مَعَ','n'],['السِّنْجَابِ.','s']];\nvar CW=[['الْوَرْدَةُ','q'],['السَّمَاءُ','s'],['التُّوتُ','s'],['الْكِتَابُ','q']];\nvar ST=[\n{q:1,t:'m',ask:'اختر الكلمات التي تحتوي لامًا شمسية',items:['الْبَابُ','الشَّمْسُ','التِّمْسَاحُ','الْقَمَرُ','الْمَوْزُ'],ok:[1,2]},\n{q:2,t:'t',ask:'اضغط على الكلمة التي فيها لام شمسية ☀️',col:'s'},\n{q:2,t:'t',ask:'اضغط على الكلمة التي فيها لام قمرية 🌙',col:'q'}\n].concat(CW.map(function(c){return{q:3,t:'c',ask:'صنّف الكلمة حسب الجدول',w:c[0],ans:c[1]}}));\nvar GOOD=['أحسنت! 🌟','ممتاز! 🎉','برافو عليك! 👏','رائع جدًا! 🚀','أنت شاطر! 💪','يا سلام! 🥳'];\nvar BAD=['حاول مرة ثانية، أنت تقدر! 💛','قريب! جرّب مرة أخرى 🙂','فكّر: هل تُنطق اللام أم لا؟ 🤔'];\nvar app=document.getElementById('app'),s,AC;\nfunction pick(a){return a[Math.floor(Math.random()*a.length)]}\nfunction strip(w){return w.replace(/[،.]/g,'')}\nfunction ding(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();[523,659,784,1047].forEach(function(f,i){var o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+i*0.1;o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.25,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+0.25);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+0.3)})}catch(e){}}\nfunction boom(){ding();var e=['🎉','⭐','🌟','✨','🎈','🍀'];\n for(var i=0;i<12;i++){var p=document.createElement('span');p.className='pop';p.textContent=pick(e);p.style.left=(10+Math.random()*80)+'%';p.style.top=(50+Math.random()*30)+'%';document.body.appendChild(p);(function(x){setTimeout(function(){x.remove()},1300)})(p)}}\nfunction play(){s={i:0,mist:0,tries:0,found:[],tok:{},t2:{s:[],q:[]},t3:{s:[],q:[]},lock:0};draw('')}\nfunction tbl(a,rows){\n var h='<table><tr><th style=\"background:'+SC+'\">☀️ اللام الشمسية<\/th><th style=\"background:'+QC+'\">🌙 اللام القمرية<\/th><\/tr>';\n for(var r=0;r<rows;r++)h+='<tr><td style=\"color:'+SC+'\">'+(a.s[r]||'')+'<\/td><td style=\"color:'+QC+'\">'+(a.q[r]||'')+'<\/td><\/tr>';\n return h+'<\/table>'}\nfunction draw(m,c){\n var st=ST[s.i],h='<div class=\"top\"><span>🦉 الشمسية والقمرية<\/span><span>السؤال '+st.q+' / 3<\/span><\/div><div class=\"bar\"><i style=\"width:'+(s.i/ST.length*100)+'%\"><\/i><\/div><div class=\"ask\">'+st.ask+'<\/div>';\n h+='<div class=\"tip\"><b style=\"background:'+SC+'\">☀️ شمسية<\/b> اللام لا تُنطق مثل: الشَّمْسُ &nbsp; <b style=\"background:'+QC+'\">🌙 قمرية<\/b> اللام تُنطق مثل: الْقَمَرُ<\/div>';\n if(st.t=='m'){h+='<div class=\"tiles\">'+st.items.map(function(w,n){return'<button class=\"tile'+(s.found.indexOf(n)>=0?' ok':'')+'\" id=\"t'+n+'\" onclick=\"tapM('+n+')\">'+w+'<\/button>'}).join('')+'<\/div>'}\n if(st.t=='t'){h+='<div class=\"para\">'+T2.map(function(t,n){var d=s.tok[n];return'<button class=\"w'+(d?' ok':'')+'\" id=\"w'+n+'\"'+(d?' style=\"background:'+d+'\"':'')+' onclick=\"tapT('+n+')\">'+t[0]+'<\/button>'}).join(' ')+'<\/div>'+tbl(s.t2,1)}\n if(st.t=='c'){h+='<div class=\"word\">'+st.w+'<\/div><div class=\"cls\"><button class=\"cb\" id=\"cbs\" style=\"background:'+SC+'\" onclick=\"cl(\\'s\\')\">☀️ لام شمسية<\/button><button class=\"cb\" id=\"cbq\" style=\"background:'+QC+'\" onclick=\"cl(\\'q\\')\">🌙 لام قمرية<\/button><\/div>'+tbl(s.t3,2)}\n h+='<div id=\"msg\"'+(c?' style=\"color:'+c+'\"':'')+'>'+(m||'')+'<\/div>';app.innerHTML=h}\nfunction adv(){s.lock=1;setTimeout(function(){s.lock=0;s.i++;s. "<!DOCTYPE html>\n<html lang=\"ar\" dir=\"rtl\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>مسعودة والعطلة الصيفية<\/title>\n<link href=\"https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;800&display=swap\" rel=\"stylesheet\">\n<style>\n:root{--bg:#fff4d6;--ink:#2b2250;--card:#fff;--line:#c9bfa5;--pur:#7c4dff;--grn:#22b573;--yel:#ffc425;--red:#ff5a5f;--blu:#2d9cff;--org:#ff914d;\nbox-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#241b4a;--ink:#fff6e0;--card:#352a68;--line:#5b4f95}}\n*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}\nhtml{scroll-padding-top:env(safe-area-inset-top,0px)}\nbody{margin:0;background:var(--bg);color:var(--ink);font-family:'Baloo Bhaijaan 2',Tahoma,sans-serif;display:flex;justify-content:center}\n#app{width:100%;max-width:560px;padding:14px;text-align:center}\nh1{font-size:1.6rem;margin:4px 0;color:var(--pur)}\n.top{display:flex;justify-content:space-between;align-items:center;font-weight:800}\n.bar{height:12px;background:rgba(124,77,255,.2);border-radius:9px;overflow:hidden;margin:6px 0 10px}\n.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--yel),var(--org));transition:width .4s}\n.sec{display:inline-block;background:var(--yel);color:#2b2250;border-radius:12px;padding:0 12px;font-weight:800;font-size:.95rem}\n.ask{background:var(--pur);color:#fff;border-radius:20px;padding:12px 10px;margin:8px 0;font-size:1.3rem;font-weight:800;box-shadow:0 4px 0 rgba(0,0,0,.2);line-height:1.7}\n.pas{background:var(--card);border-radius:20px;padding:12px;margin:8px 0;text-align:right;font-size:1.2rem;line-height:2.1;box-shadow:0 4px 0 rgba(0,0,0,.12)}\ndetails.pas summary{font-weight:800;color:var(--pur);cursor:pointer;text-align:center}\n.opts{display:flex;flex-direction:colu ;display:inline-block;max-width:92%;padding:0 12px;margin:6px 0;word-break:break-word}\n.cert p{margin:6px 0;font-size:1.1rem;font-weight:500;color:#3b2a00}\n.cert .dec{font-size:1.5rem;letter-spacing:4px}\n@media (prefers-reduced-motion:reduce){.mascot,.pop,.o.bad,.o.hint{animation:none}}\n<\/style>\n<\/head>\n<body>\n<div id=\"app\"><\/div>\n<script>\nvar TXT='عِنْدَمَا جَاءَتِ الْعُطْلَةُ الصَّيْفِيَّةُ فَرِحَتْ مَسْعُودَةُ؛ لِأَنَّهَا سَتَذْهَبُ إِلَى الْبَقَّالَةِ عَصْرَ كُلِّ يَوْمٍ، لِشِرَاءِ مَا لَذَّ وَطَابَ مِنْ رَقَائِقِ الْبَطَاطِسِ الْمُقَرْمَشَةِ.<br>ذَهَبَتْ إِلَى أَبِيهَا لِأَخْذِ النُّقُودِ، لَكِنَّهُ سَأَلَهَا عَمَّا تَرْغَبُ فِي شِرَائِهِ.<br>قَالَتْ مَسْعُودَةُ: “سَأَشْتَرِي كِيسًا مِنْ رَقَائِقِ الْبَطَاطِسِ الْمُمَلَّحَةِ، وَكِيسًا مِنْ حَلَقَاتِ الْبَطَاطِسِ الْمُقَرْمَشَةِ. آهٍ! كَمْ هِيَ شَهِيَّةٌ وَلَذِيذَةٌ!”';\nvar ST=[\n{k:'read'},\n{k:'mc',sec:'أفهم المفردة من السياق',q:'ما معنى عبارة “مَا لَذَّ وَطَابَ”؟',o:['مَا كَانَ شَهِيًّا وَلَذِيذًا','مَا كَانَ قَلِيلًا وَرَخِيصًا','مَا كَانَ قَدِيمًا'],a:0},\n{k:'mc',sec:'أفهم المفردة من السياق',q:'ما مرادف كلمة (تَرْغَبُ)؟',o:['تُحِبُّ وَتُرِيدُ','تَكْرَهُ وَتَرْفُضُ','تَنَامُ وَتَرْتَاحُ'],a:0},\n{k:'mc',sec:'أستخرج من الفقرة',q:'ما مفرد كلمة “أَكْيَاسٌ”؟',o:['كِيسٌ','كِيسَانِ','كِيسَاتٌ'],a:0},\n{k:'mc',sec:'أستخرج من الفقرة',q:'ما جمع كلمة “حَلَقَةٌ”؟',o:['حَلَقَاتٌ','حَلَقَتَانِ','حَلْقٌ'],a:0},\n{k:'mc',sec:'أستخرج من الفقرة',q:'ما ضد كلمة “حَزِنَتْ”؟',o:['فَرِحَتْ','بَكَتْ','غَضِبَتْ'],a:0},\n{k:'multi',sec:'أستخرج من الفقرة',q:'اختر كلمتين مترادفتين من الفقرة',o:['شَهِيَّةٌ','لَذِيذَةٌ','الْمُقَرْمَشَةِ','الْمُمَلَّحَةِ'],ok:[0,1]},\n{k:'mc',sec:'أوظّف',q:'اختر الجملة المفيدة التي فيها مرادف كلمة (تَرْغَبُ)',o:['أُرِيدُ أَنْ أَلْعَبَ فِي الْحَدِيقَةِ.','أَنَامُ مُبَكِّرًا كُلَّ لَيْلَةٍ.','أَرْفُضُ أَنْ أَلْعَبَ فِي الْحَدِيقَةِ.'],a:0},\n{k:'mc',sec:'أُبْدِي رَأْيِي',q:'هل تناول رقائق البطاطس كل يوم قرار مناسب؟',o:['لَا، لِأَنَّهَا تَحْتَوِي عَلَى مِلْحٍ وَدُهُونٍ كَثِيرَةٍ تَضُرُّ بِصِحَّتِي.','نَعَمْ، لِأَنَّهَا لَذِيذَةٌ جِدًّا.','نَعَمْ، لِأَنَّهَا لَا تَضُرُّ أَبَدًا.'],a:0,bad:'فكّر في صحتك: هل الأكل المالح والدهني كل يوم مفيد؟ 💚'},\n{k:'mc',sec:'أختار السبب المناسب',q:'فَرِحَتْ مَسْعُودَةُ بِالْعُطْلَةِ الصَّيْفِيَّةِ. ما السبب؟',o:['لِأَنَّهَا سَتُسَافِرُ مَعَ أُسْرَتِهَا.','لِأَنَّهَا سَتَذْهَبُ إِلَى الْبَقَّالَةِ لِشِرَاءِ رَقَائِقِ الْبَطَاطِسِ.'],a:1,bad:'ارجع إلى النص: لماذا ستذهب مسعودة كل يوم؟ 📖'}\n];\nvar COLS=['var(--blu)','var(--org)','var(--pur)','#e84393'],LET=['أ','ب','ت','ث'];\nvar GOOD=['أحسنت! 🌟','ممتاز! 🎉','برافو عليك! 👏','رائع جدًا! 🚀','أنت شاطر! 💪','يا سلام! 🥳'];\nvar BAD=['حاول مرة ثانية، أنت تقدر! 💛','قريب! جرّب إجابة أخرى 🙂','اقرأ النص مرة ثانية 📖'];\nvar app=document.getElementById('app'),s,AC;\nfunction pick(a){return a[Math.floor(Math.random()*a.length)]}\nfunction shuf(n){var a=[];for(var i=0;i<n;i++)a.push(i);return a.sort(function(){return Math.random()-.5})}\nfunction ding(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();[523,659,784,1047].forEach(function(f,i){var o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+i*0.1;o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.25,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+0.25);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+0.3)})}catch(e){}}\nfunction boom(){ding();var e=['🎉','⭐','🌟','✨','🎈','🍀'];\n for(var i=0;i<12;i++){var p=document.createElement('span');p.className='pop';p.textContent=pick(e);p.style.left=(10+Math.random()*80)+'%';p.style.top=(50+Math.random()*30)+'%';document.body.appendChild(p);(function(x){setTimeout(function(){x.remove()},1300)})(p)}}\nfunction play(){s={i:0,mist:0,tries:0,lock:0,reads:0,found:[]};prep();draw('')}\nfunction prep(){var st=ST[s.i];s.tries=0;s.found=[];s.ord=st.o?shuf(st.o.length):[]}\nfunction draw(m,c){\n var st=ST[s.i],h='<div class=\"top\"><span>🦉 مسعودة والعطلة<\/span><span>'+(s.i+1)+' / '+ST.length+'<\/span><\/div><div class=\"bar\"><i style=\"width:'+(s.i/ST.length*100)+'%\"><\/i><\/div>';\n if(st.k=='read'){\n  h+='<div class=\"ask\">اقرأ النص ثلاث مرات، ثم ضع إشارة ✓ عند كل قراءة<\/div><div class=\"pas\">'+TXT+'<\/div><div class=\"checks\">';\n  ['الأولى','الثانية','الثالثة'].forEach(function(t,n){h+='<div class=\"ck'+(n<s.reads?' on':'')+'\"><span>'+(n<s.reads?'✅':'⬜')+'<\/span>القراءة '+t+'<\/div>'});\n  h+='<\/div>'+(s.reads<3?'<button class=\"btn\" onclick=\"readIt()\">قرأتُ النص ✓<\/button>':'')}\n else{\n  h+='<span class=\"sec\">'+st.sec+'<\/span><div class=\"ask\">'+st.q+'<\/div><details class=\"pas\"><summary>📖 اقرأ النص<\/summary>'+TXT+'<\/details>';\n  if(st.k=='mc'){h+='<div class=\"opts\">'+s.ord.map(function(idx,p){return'<button class=\"o\" id=\"o'+idx+'\" style=\"background:'+COLS[p]+'\" onclick=\"pickO('+idx+')\"><b>'+LET[p]+'<\/b>'+st.o[idx]+'<\/button>'}).join('')+'<\/div>'}\n  else{h+='<div class=\"opts\">'+s.ord.map(function(idx,p){return'<button class=\"o'+(s.found.indexOf(idx)>=0?' ok':'')+'\" id=\"o'+idx+'\" style=\"background:'+COLS[p]+'\" onclick=\"pickM('+idx+')\">'+st.o[idx]+'<\/button>'}).join('')+'<\/div>'}}\n h+='<div id=\"msg\"'+(c?' style=\"color:'+c+'\"':'')+'>'+(m||'')+'<\/div>';app.innerHTML=h}\nfunction adv(){s.lock=1;setTimeout(function(){s.lock=0;s.i++;if(s.i>=ST.length)end();else{prep();draw('')}},1500)}\nfunction readIt(){s.reads++;boom();draw(s.reads<3?'أحسنت! كمّل القراءة 📖':pick(GOOD),'var(--grn)');if(s.reads==3)adv()}\nfunction wrong(el,hid,t){\n s.tries++;s.mist++;var m=document.getElementById('msg');m.style.color='var(--red)';m.textContent=t||pick(BAD);\n if(el){el.classList.add('bad');setTimeout(function(){el.classList.remove('bad')},450)}\n if(s.tries>=2){var e=document.getElementById(hid);if(e){e.classList.add('hint');setTimeout(function(){e.classList.remove('hint')},3000)}}}\nfunction pickO(idx){\n var st=ST[s.i];if(s.lock)return;var b=document.getElementById('o'+idx);\n if(idx==st.a){b.classList.add('ok');boom();var m=document.getElementById('msg');m.style.color='var(--grn)';m.textContent=pick(GOOD);adv()}\n else wrong(b,'o'+st.a,st.bad&&s.tries==0?st.bad:null)}\nfunction pickM(idx){\n var st=ST[s.i];if(s.lock||s.found.indexOf(idx)>=0)return;\n if(st.ok.indexOf(idx)>=0){s.found.push(idx);boom();\n  if(s.found.length==st.ok.length){draw(pick(GOOD),'var(--grn)');adv()}else draw('ممتاز! ابحث عن الكلمة المرادفة الثانية 🔍','var(--grn)')}\n else wrong(document.getElementById('o'+idx),'o'+st.ok.filter(function(x){return s.found.indexOf(x)<0})[0])}\nfunction end(){\n app.innerHTML='<div class=\"mascot\">🏆<\/div><h1>مبروك! أنهيت اللعبة 🎉<\/h1><p style=\"font-size:1.2rem;font-weight:800\">اكتب اسمك لتحصل على شهادتك<\/p><input id=\"nm\" maxlength=\"20\" placeholder=\"اسمك هنا\" style=\"font:inherit;font-size:1.4rem;padding:10px;border-radius:16px;border:3px solid var(--pur);width:80%;text-align:center;background:var(--card);color:var(--ink)\"><br><button class=\"btn\" onclick=\"cert()\">احصل على الشهادة<\/button>'}\nfunction cert(){\n var nm=(document.getElementById('nm').value||'').trim()||'بطل القراءة';\n var n=s.mist<=3?3:s.mist<=8?2:1;\n app.innerHTML='<div class=\"cert\"><div class=\"dec\">🌟🎈🌟🎈🌟<\/div><div style=\"font-size:3.4rem\">🏆<\/div><h2>شهادة تقدير<\/h2><p>تُمنح هذه الشهادة إلى البطل / البطلة<\/p><div class=\"nm\" id=\"cn\"><\/div><p>تقديرًا لتميّزك واجتهادك في قراءة النص وفهمه<\/p><div style=\"font-size:2.2rem\">'+'⭐'.repeat(n)+'<\/div><p>'+new Date().toLocaleDateString('ar')+'<\/p><div class=\"dec\">🎈🌟🎈🌟🎈<\/div><\/div><p style=\"font-weight:800\">📸 التقط صورة للشاشة لتحفظ شهادتك<\/p><button class=\"btn\" onclick=\"play()\">العب مرة ثانية<\/button>';\n document.getElementById('cn').textContent=nm;\n boom();setTimeout(boom,500)}\nplay();\n<\/script>\n<style>body{padding-bottom:76px}<\/style><button onclick=\"location.reload()\" aria-label=\"القائمة\" style=\"position:fixed;left:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);z-index:50;font:inherit;font-weight:800;font-size:1rem;background:#2b2250;color:#fff;border:0;border-radius:22px;padding:8px 14px;box-shadow:0 3px 0 rgba(0,0,0,.3);cursor:pointer\">🏠 القائمة<\/button><\/body>\n<\/html>\n"];
var M=[
['🚀','مغامرة الكلمات','أربعة مستويات: أنواع الأسماء والأفعال والحروف','var(--grn)'],
['📄','اقرأ الفقرة ثم استخرج','أحمد وراشد والقطة (صفحة 17)','var(--blu)'],
['🧩','رتّب الكلمات لتكوّن جملة','جملتان مفيدتان: التلاميذ والمزارع','var(--org)'],
['🖍️','لوّن الأسماء','أخضر للإنسان، أصفر للنبات، أحمر للحيوان','var(--pur)'],
['☀️','اللام الشمسية واللام القمرية','ثلاثة أسئلة: اختر، استخرج، صنّف','var(--red)'],
['📖','مسعودة والعطلة الصيفية','فهم المقروء: معاني ومرادفات وأسباب','#e84393']
];
var h='<div class="mascot">🦉</div><h1>ألعاب اللغة العربية</h1><p class="sub">أهلًا يا بطل! اختر لعبة وابدأ المرح 🎉</p>';
M.forEach(function(m,i){h+='<button class="g" style="background:'+m[3]+'" onclick="openGame('+i+')"><span class="ic">'+m[0]+'</span><span>'+m[1]+'<small>'+m[2]+'</small></span></button>'});
document.getElementById('app').innerHTML=h;
function openGame(i){document.open();document.write(G[i]);document.close()}
</script>
